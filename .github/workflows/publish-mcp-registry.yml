name: Publish MCP Registry metadata

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - server.json
      - .github/workflows/publish-mcp-registry.yml

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pinned MCP publisher
        run: |
          curl -fsSLO https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz
          echo "ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac  mcp-publisher_linux_amd64.tar.gz" | sha256sum --check
          tar -xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher

      - name: Validate registry metadata
        run: ./mcp-publisher validate

      - name: Check whether this exact version is already active
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          name="$(jq -er '.name' server.json)"
          version="$(jq -er '.version' server.json)"
          encoded_name="$(jq -rn --arg value "$name" '$value|@uri')"
          url="https://registry.modelcontextprotocol.io/v0.1/servers/${encoded_name}/versions/${version}"
          status="$(curl -sS -o registry-response.json -w '%{http_code}' "$url")"

          if [[ "$status" == "404" ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$status" != "200" ]]; then
            echo "Registry preflight returned HTTP $status" >&2
            cat registry-response.json >&2
            exit 1
          fi

          jq -e --arg name "$name" --arg version "$version" \
            '.server.name == $name and .server.version == $version and ._meta["io.modelcontextprotocol.registry/official"].status == "active"' \
            registry-response.json >/dev/null
          jq -S . server.json > expected-server.json
          jq -S .server registry-response.json > published-server.json
          if ! diff -u expected-server.json published-server.json; then
            echo "The version already exists with different metadata; bump server.json version before publishing." >&2
            exit 1
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"

      - name: Authenticate with GitHub OIDC
        if: steps.registry.outputs.exists != 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish to the official MCP Registry
        if: steps.registry.outputs.exists != 'true'
        run: ./mcp-publisher publish

      - name: Verify the active registry record
        shell: bash
        run: |
          set -euo pipefail
          name="$(jq -er '.name' server.json)"
          version="$(jq -er '.version' server.json)"
          encoded_name="$(jq -rn --arg value "$name" '$value|@uri')"
          url="https://registry.modelcontextprotocol.io/v0.1/servers/${encoded_name}/versions/${version}"
          curl --fail --silent --show-error "$url" -o registry-readback.json
          jq -e --arg name "$name" --arg version "$version" \
            '.server.name == $name and .server.version == $version and ._meta["io.modelcontextprotocol.registry/official"].status == "active"' \
            registry-readback.json >/dev/null
          jq -S . server.json > expected-server.json
          jq -S .server registry-readback.json > published-server.json
          diff -u expected-server.json published-server.json
