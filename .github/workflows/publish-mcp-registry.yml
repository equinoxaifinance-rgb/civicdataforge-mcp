name: Publish MCP Registry metadata

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - server.json
      - .github/workflows/publish-mcp-registry.yml

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pinned MCP publisher
        run: |
          curl -fsSLO https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz
          echo "ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac  mcp-publisher_linux_amd64.tar.gz" | sha256sum --check
          tar -xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher

      - name: Validate registry metadata
        run: ./mcp-publisher validate

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish to the official MCP Registry
        shell: bash
        run: |
          set +e
          output="$(./mcp-publisher publish 2>&1)"
          status=$?
          set -e

          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          if grep -Fq 'invalid version: cannot publish duplicate version' <<<"$output"; then
            echo "Registry version is already published; treating this idempotent replay as current."
            exit 0
          fi

          exit "$status"
